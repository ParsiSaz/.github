---
name: "Reusable Translation Mod Release"

on:
  workflow_call:
    inputs:
      exclude-patterns:
        required: false
        type: string
        default: "*.git* .github/* *.bak *.tmp *.pyc __pycache__/*"

permissions:
  contents: write

jobs:
  bundle-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Zip Package
        run: |
          REPO_NAME=$(basename "${{ github.repository }}")
          ZIP_NAME="${REPO_NAME}-Persian-Translation.zip"
          echo "Packaging translation into ${ZIP_NAME}..."
          zip -r "${ZIP_NAME}" . -x ${{ inputs.exclude-patterns }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "*-Persian-Translation.zip"
          generate_release_notes: true

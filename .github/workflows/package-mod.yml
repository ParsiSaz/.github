---
name: "Release Translation Package"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Bundle Translation Files"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Create Zip Package
        run: |
          REPO_NAME=$(basename "${{ github.repository }}")
          ZIP_NAME="${REPO_NAME}-Persian-Translation.zip"
          echo "Packaging translation into ${ZIP_NAME}..."
          zip -r "${ZIP_NAME}" . -x "*.git*" ".github/*" "*.bak" "*.tmp"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "*-Persian-Translation.zip"
          generate_release_notes: true
